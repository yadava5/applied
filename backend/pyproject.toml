[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobtracker"
version = "0.1.0"
description = "Email-powered job application tracker with ML classification"
# NO `readme` KEY, deliberately (#403). It declared "README.md" and that file
# has never existed in this directory, which made every documented way of
# installing the backend fail at metadata time rather than at import time:
#
#   $ cd backend && uv sync
#   OSError: Readme file does not exist: README.md          (exit 1)
#   $ uv pip install -e .                                    (exit 1)
#
# So the package could not be installed at all, and nothing noticed, because
# CI runs the suite from `requirements-dev.txt` against the source tree and
# never builds this package. The docs are at the repository root; the same is
# true of LICENSE, which is why `license-files` is unset just below.
# Proprietary, all rights reserved -- see the repository-root LICENSE. Written
# as a PEP 639 `LicenseRef-` expression because no SPDX identifier describes
# "no licence granted to anyone"; `license-files` is not set because the LICENSE
# file lives at the repository root, outside this project directory.
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [
    { name = "Ayush Yadav" }
]
keywords = ["job-tracker", "email", "ml", "fastapi", "nextjs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    # PyPI rejects any distribution carrying a `Private ::` classifier, which is
    # the conventional way to say "this package must never be published". It
    # applies here: `jobtracker` is proprietary, is only ever installed from this
    # tree, and the name is generic enough to be uploaded by accident. Hatchling
    # skips trove validation for classifiers starting `Private ::`, so this does
    # not break a local build.
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.1.0",
    "websockets>=17.0.1",
    "aiosqlite>=0.22.1",
    "sqlmodel>=0.0.14",
    "sqlalchemy[asyncio]>=2.0.25",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "aioimaplib>=2.0.0",
    "keyring>=25.7.0",
    "sentence-transformers>=5.7.0",
    # The <5 cap is load-bearing: under transformers 5.x setfit fails to import and
    # HybridClassifier silently degrades to the rules layer, so the benchmark keeps
    # printing the rules score under the cascade's name. Full rationale, including
    # the CVEs the cap holds open, is in requirements.txt next to the same pin --
    # not duplicated here. Editable installs resolve from this file, so it must
    # carry the cap too.
    "transformers>=4.40,<5",
    "setfit>=1.1.3",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1",
    "ruff>=0.16.2",
    "mypy>=1.8.0",
]
dist = [
    "pyinstaller>=6.22.0",
]

# No [project.scripts]. The `jobtracker` console script pointed at
# `jobtracker.main:run`, which booted the DESKTOP FastAPI app on 127.0.0.1:8000
# for the SwiftUI client. Both were deleted when `apps/macos` was de-scoped and
# the unmounted desktop routers went with it (issue #73). The cloud app has no
# CLI entry point by design: Vercel imports `api/index.py` as an ASGI callable.

[project.urls]
Homepage = "https://github.com/yadava5/applied"
Repository = "https://github.com/yadava5/applied"
Issues = "https://github.com/yadava5/applied/issues"

# ============================================================================
# Tool Configuration
# ============================================================================

# Lint settings live under [tool.ruff.lint]. They used to sit at the top level,
# which ruff still accepts but warns about ("The top-level linter settings are
# deprecated in favour of their counterparts in the `lint` section"). Since the CI
# ruff step is continue-on-error, the day ruff drops the legacy keys the step would
# go quiet without going red -- moved ahead of the ruff floor bump for that reason.
# Relocation only: same families, same ignores, same per-file ignores.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["jobtracker"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "setfit.*",
    "sklearn.*",
    "keyring.*",
    "aioimaplib.*",
    "googleapiclient.*",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["jobtracker"]
