version: 2

# Dependency updates for every ecosystem this repository actually builds from.
# Until now there was none, which meant the only thing raising a floor on a
# vulnerable transitive was a human noticing — see the "Security pins" block at
# the bottom of the root requirements.txt, all of which were added by hand after
# the fact. That is not a process; this is.
#
# Deliberately NOT covered, so the omissions are decisions and not oversights:
#   - ml/demo/space/requirements.txt — a generated artifact. `ml/demo/
#     package_space.py` writes that whole tree when packaging the Hugging Face
#     Space; a PR against it would be reverted by the next package run.
#   - ml/wandb/**/requirements.txt — a W&B run manifest recording what WAS
#     installed for a past experiment. Bumping it would falsify the record.
#     (No such file is tracked as of 2026-08-31; the decline is kept because
#     the tree returns whenever a run is committed, and the reason still holds.)
#   - backend/uv.lock — a LOCAL development lockfile. Dependabot reads uv.lock
#     through a separate `uv` package-ecosystem, NOT through `pip`: see
#     dependabot-core, where uv/lib/dependabot/uv/file_fetcher.rb declares
#     ECOSYSTEM_SPECIFIC_FILES = %w(uv.lock) while the python fetcher's list is
#     %w(Pipfile setup.py setup.cfg) and never names it. So the /backend entry
#     below does not cover it, and an earlier version of this file wrongly said
#     it did.
#     Declined rather than covered, for two reasons. It is referenced nowhere in
#     .github/, vercel.json or docs/ — CI and the Vercel function build from
#     requirements.txt, never from this file. And its constraints are derived:
#     `transformers>=4.40,<5` in uv.lock is the same cap, resolved out of
#     backend/pyproject.toml, which the /backend entry DOES cover. Bumping the
#     source is the operative change; `uv lock` regenerates this file.
#     The cost, stated rather than hidden: the three open transformers alerts
#     are reported against this path, and they will stay open. They are the
#     accepted cost recorded in backend/requirements.txt either way, held by a
#     deliberate cap with no 4.x fix. And after a pip PR moves pyproject.toml
#     this file is stale until someone re-locks.
#     Adding a `uv` entry at /backend instead would be legal — the uniqueness
#     rule is per-ecosystem — but uv's fetcher also reads pyproject.toml, which
#     is the overlap that produced the duplicate #58/#60 pull requests this file
#     spends the block below documenting. Do not add one without checking that
#     first.
#   (`apps/macos` used to be listed here — Dependabot's `swift` ecosystem needs
#    a Package.swift and this project's only SwiftPM state was a
#    Package.resolved inside the .xcodeproj. The whole tree was deleted when the
#    desktop app was de-scoped, so there is no ecosystem left to decline.)
#
# No `labels:` here on purpose. Dependabot cannot create labels, and naming one
# that does not exist fails the whole update as a config error on the Dependabot
# tab rather than degrading gracefully. Of the obvious candidates this repo only
# has `ci`; `dependencies`, `python` and `javascript` do not exist. Add them in
# repository settings first if you want the PRs labelled.

updates:
  # ---------------------------------------------------------------------------
  # Python — the Vercel cloud function (jobtracker-api).
  # ---------------------------------------------------------------------------
  # This manifest is hand-tuned against Vercel's Python function size budget and
  # carries an explicit DO-NOT-ADD list (torch, setfit, keyring, aiosqlite, ...).
  # Dependabot only bumps what is already pinned here, so it cannot introduce
  # those — but a major bump can still pull a heavier transitive tree, so these
  # PRs want a human eye rather than an automerge.
  #
  # `exclude-paths` is what keeps this entry pointed at the root manifest and
  # nothing else. Without it, it also updated backend/: pip's file fetcher scans
  # the configured `directory` for requirements files and then descends one
  # level into every immediate subdirectory, so `directory: "/"` was reaching
  # backend/requirements*.txt and duplicating the /backend entry below. It
  # surfaced as two pull requests carrying byte-identical diffs for a single
  # pin — #58 and #60 both raising transformers in backend/requirements.txt,
  # #56 and #62 both raising setfit — while the file this entry exists to guard
  # got no PRs at all and sat on a stale email-validator>=2.0.0 floor that #63
  # was raising over in backend/. GitHub's own reference states the rule this
  # broke: with more than one block per ecosystem and branch, "you must ensure
  # that all values are unique and there is no overlap in directories defined."
  #
  # `backend/**` excludes the backend directory entry itself from the scan, so
  # the descent into it never begins. Patterns are globs relative to this
  # entry's `directory`; `directory` takes no wildcards of its own (only the
  # plural `directories` does, and that would not have stopped the descent
  # either — there is no directory-recursion switch to turn off).
  #
  # The list is live, not decorative. Because the descent is exactly one level,
  # a requirements .txt landing directly in any other top-level directory
  # (api/, scripts/, ...) would start being updated from here and would need
  # adding above. That one-level limit is also why the ml/** manifests called
  # out at the top of this file have never needed excluding — they sit three or
  # more levels down, out of reach. And if duplicate PRs ever reappear, read
  # the Dependabot run log before editing anything: exclude-paths filtering is
  # gated server-side, and a key that is accepted but not honoured is silently
  # a no-op rather than the loud config error an unknown key would be.
  #
  # Monthly, not weekly: `schedule` governs Dependabot's VERSION updates only.
  # Security updates are a separate mechanism, unaffected by this interval, so
  # vulnerability patches still arrive immediately regardless of the cadence.
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "backend/**"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Python — the full backend (runtime + dev + migration extras).
  # ---------------------------------------------------------------------------
  # One entry covers requirements.txt, requirements-dev.txt and
  # requirements-migrate.txt: Dependabot picks up every requirements file in the
  # directory it is pointed at — and, less obviously, in each of that
  # directory's immediate subdirectories, which is the reach the root entry
  # above has to exclude. All three files sit directly in backend/, so none of
  # them depend on that descent.
  #
  # It also covers backend/pyproject.toml, whose [project] dependencies list is
  # the source of truth for the packaged app. pyproject.toml is only ever read
  # from an entry's own directory and never from a subdirectory, so this is the
  # only entry that can see it — which is why the fix above is a narrowing of
  # the root entry rather than a deletion of this one.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # THE `<5` CAP IS GONE (#746), AND BOTH IGNORES WENT WITH IT. They existed
    # only to stop Dependabot refiling a bump that could not resolve against
    # that cap; with the cap lifted there is nothing to refile and nothing to
    # suppress, so leaving them would silently withhold a real major forever.
    #
    # What the cap was guarding, and why it stopped being true. It rested on two
    # facts: that no setfit release supported transformers 5, and that lifting it
    # would break setfit SILENTLY --
    #     ImportError: cannot import name 'default_logdir'
    #                  from 'transformers.training_args'
    # caught by HybridClassifier, degrading to the rules layer while the
    # benchmark kept printing the rules figure under the cascade's name.
    # `backend/tests/test_evaluate_classifier_layer_guard.py` records that as
    # observed. The comment here said lifting it needed "a setfit release that
    # supports transformers 5 AND a decision to re-measure and republish the
    # number -- not a green CI run." Both halves are now answered by
    # measurement rather than argument: setfit 1.2.0 supports both majors, and
    # `scripts/cascade_gate.sh --mode hybrid --hybrid-profile full` returns
    # BIT-IDENTICAL predictions under transformers 5.16.1 and 4.57.6 -- the same
    # four misclassified items, `embeddings loaded=True`, `setfit loaded=True`.
    # The published number does not move, so there is nothing to republish.
    #
    # The four advisories the cap held open (PYSEC-2026-2288/2289/2290 and
    # PYSEC-2025-217) are closed by the new floor rather than accepted.
    #
    # PR #681 -- "update sentence-transformers requirement from >=5.7.0 to
    # >=6.0.0" -- went red on four jobs precisely BECAUSE of the cap: ST 6.0.1
    # declares `transformers<6.0.0,>=5.0.0`, unsatisfiable against `<5`. That
    # red was correct and is what this change resolves; ST 6.0.0 is now the
    # declared floor.
    groups:
      pip-backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Node — the Next.js app (jobtracker-web).
  # ---------------------------------------------------------------------------
  # `npm` is the correct ecosystem name for a pnpm workspace; Dependabot reads
  # pnpm-lock.yaml natively. Note package.json also carries a `pnpm.overrides`
  # block pinning patched versions of transitives (brace-expansion, js-yaml,
  # postcss, sharp, ws) — Dependabot does not manage those, so they still need
  # to be revisited by hand when the direct dep that pulls them moves.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Node — the System Card booklet (booklet/).
  # ---------------------------------------------------------------------------
  # A standalone Vite/React sub-project with its own workflow
  # (.github/workflows/booklet.yml) whose `build:system-card` script writes into
  # apps/web/public/system-card — so this manifest SHIPS, it is not a local
  # authoring tool. .gitignore carries a deliberate carve-out to keep
  # booklet/package-lock.json tracked.
  #
  # It was covered by nothing until now, and was not on the declined list at the
  # top of this file either, so it was an oversight rather than a decision — the
  # one thing that preamble claims does not happen here.
  #
  # What the gap actually cost: GHSA/CVE-2026-56876 (high) sits open against
  # extract-zip 2.0.1, reached through puppeteer 23.11.1 -> @puppeteer/browsers
  # 2.6.1. GitHub reports no patched version, which reads like "nothing to do".
  # There is something to do: @puppeteer/browsers dropped extract-zip outright
  # by 3.2.1 (its deps are yargs and modern-tar), and puppeteer 25.x pulls that.
  # The fix is a dependency bump nobody was going to be told about.
  #
  # Grouped minor+patch like the other Node entry. The puppeteer major stays
  # ungrouped on purpose: booklet's `pdf` script drives Puppeteer directly and a
  # major there can change the PDF, so that one wants a human and a re-export
  # rather than a green install.
  #
  # EXPECT SOME OF THESE PULL REQUESTS TO LAND RED, and do not read that as a
  # broken config. .github/workflows/booklet.yml rebuilds the System Card on any
  # `booklet/**` pull request and exits 1 on a single byte of difference in
  # apps/web/public/system-card. `react`, `react-dom`, `vite` and
  # `@vitejs/plugin-react` all change bundle bytes and hashed filenames, and
  # Dependabot cannot rebuild the card. Those need `npm run build:system-card`
  # and a commit on the branch, exactly as that workflow's comment describes.
  # `puppeteer`, `typescript` and `@types/*` do not reach the output —
  # `build:system-card` is `tsc --noEmit && vite build`, so type-only changes
  # cannot alter it.
  - package-ecosystem: "npm"
    directory: "/booklet"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-booklet:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # GitHub Actions.
  # ---------------------------------------------------------------------------
  # Several workflows (codeql, gitleaks, scorecard) pin actions by full commit
  # SHA because OpenSSF Scorecard grades that. Dependabot understands SHA pins
  # and rewrites both the SHA and its version comment, so keeping this on does
  # not cost the Pinned-Dependencies score.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # codeql-action/{init,autobuild,analyze,upload-sarif} are sub-actions of a
      # single action and must move in lockstep. Dependabot treats them as four
      # separate dependencies and would otherwise bump one SHA while leaving the
      # rest behind, mismatching the workflow and hard-failing CodeQL:
      #   ##[error]Loaded a configuration file for version '4.36.2', but running version '4.37.6'
      # No update-types key on purpose: ALL updates (majors included) for these
      # sub-actions must ship together and never be separable. Listed before the
      # catch-all below because Dependabot assigns a dep to the first matching
      # group in file order.
      codeql-action:
        patterns: ["github/codeql-action*"]
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
