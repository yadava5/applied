name: Citations

# UNFILTERED, and for the same reason `decisions.yml` gives: a path-filtered
# workflow produces no context at all on a pull request that touches none of
# its paths, so if this is ever added to branch protection a change elsewhere
# would wedge. It also would not work: the whole point of this gate is that the
# compliance pack rots when SOURCE moves, so filtering on `docs/**` would skip
# exactly the commits that break it. #754's drift arrived through
# `gmail_client.py`, not through the filing.
#
# Cost is not a reason to filter it either: stdlib Python over `git ls-files`
# and one `grep`, with no install, no network and no database.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Refuses a citation in `docs/google/` or `docs/casa/` that no longer
    # resolves: a file or line that is gone, an anchor whose symbol has been
    # renamed, a citation nothing recomputes, or a published transcript that no
    # longer reproduces. Drift is repaired with `--write`; only a symbol that
    # has actually disappeared needs a human.
    name: Compliance pack citations resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Refuse a citation that no longer resolves
        timeout-minutes: 5
        run: python3 scripts/check_citations.py --check
