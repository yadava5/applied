name: Landing B race gate

# ---------------------------------------------------------------------------
# WHY THIS EXISTS AS ITS OWN WORKFLOW, AND NOT AS A STEP IN e2e-ci.yml.
#
# `landing-b.spec.ts`'s SEED 3 guards a RACE: whether `MarketingBoard` reads a
# visitor's own card open as the page's. A race is not a property you can assert
# once. The main e2e jobs run `retries: 2`, `workers: 1`, no `--repeat-each` —
# which is the correct shape for a deterministic assertion and the WORST possible
# shape for this one. Two retries turn any per-attempt failure rate p into a job
# failure rate of p^3: at the rate measured below (16%) that is 0.4%, i.e. a gate
# that reports green essentially always, on a build that is broken.
#
# So the race test runs here instead, under a shape derived from measurement:
# no retries, many repeats, and deliberate CPU contention.
#
# ---------------------------------------------------------------------------
# THE ARITHMETIC, AND THE PREMISE IT REPLACED.
#
# The shape originally proposed for this job was "--repeat-each=10 against a
# COLD server", on the belief that server warmth dominates: ~20% per attempt
# cold, ~0% once warm. That premise was tested and it does not hold. Measured on
# a production build (`next build && next start`, `--retries=0`), with the
# compound mutant applied (the beat-2 arm moved back into the effect body AND
# `OPEN_GESTURE_MS = 0`) so the race is genuinely present:
#
#   · 20 attempts, each against a FRESHLY BOOTED server, one attempt per boot:
#         0 red of 40 test instances.
#   · serial runs against ONE warm server, `--workers=1`:
#         2 red of 80 test instances  (2.5%).
#   · the same warm server with `--workers=4`:
#        13 red of 80 test instances  (16.25%).
#
# Cold did not help; contention did, by roughly 6x. That is not a surprise once
# the mechanism is read rather than guessed at. The visitor's card load is a
# `setTimeout(0)` scheduled from the click's commit (`ApplicationDetail`, the
# `app` effect); the page's claim is armed from an IntersectionObserver-driven
# commit that the pane's own `focus()` scroll triggers. Red requires the 0ms
# timer to slip PAST a rendering frame, which is a main-thread-busyness event.
# A cold server delays the first navigation — which is over long before the
# click. Nothing about it widens the window that matters.
#
# Hence `--workers=4`: four browsers and the Next server contending for the
# runner's cores is the condition that reproduces. It is a knob on the
# INSTRUMENT, not on the assertion — the spec is untouched and asserts the same
# geometry it always did.
#
# Sizing, at p = 0.1625 per test instance and n instances, detection = 1 − (1−p)^n:
#
#   n = 20  →  1 − 0.8375^20 = 97.1%
#   n = 30  →  1 − 0.8375^30 = 99.5%
#   n = 50  →  1 − 0.8375^50 = 99.99%
#
# 13/80 has a Wilson 95% interval of roughly [9.8%, 26.0%], so the honest sizing
# uses the LOWER bound rather than the point estimate:
#
#   at p = 0.098,  n = 50  →  1 − 0.902^50 = 99.4%
#
# `--repeat-each=25` × 2 viewports = 50 instances. That is the number below.
#
# For contrast, sized against the shapes that were falsified: at the serial warm
# rate (2.5%) fifty instances would give only 1 − 0.975^50 = 72%, and against a
# cold server the measured rate was 0/40 — no n makes that a gate.
#
# ---------------------------------------------------------------------------
# THE FALSE-RED QUESTION, STATED RATHER THAN ASSUMED.
#
# Contention is a knob that can produce reds for reasons other than the defect,
# so it was controlled: the identical command (`--repeat-each=25 --workers=4`)
# was run on the RESTORED build and passed 50 of 50. That control was run on a
# 10-core machine, which contends LESS than a 4-core GitHub runner. The
# false-red rate on `ubuntu-latest` at `--workers=4` is therefore UNMEASURED,
# and the first runs of this job are that measurement. Do not add this to branch
# protection until it has several green runs here; if it proves noisy, the fix
# is to lower `--workers` and raise `--repeat-each` to keep n, NOT to re-add
# retries — retries are what made the gate unable to fail in the first place.
#
# ---------------------------------------------------------------------------
# PATH FILTERS ARE DELIBERATELY IDENTICAL TO e2e-ci.yml.
#
# A REQUIRED check that is path-filtered never reports on a PR that misses the
# filter, and GitHub leaves such a PR pending forever. Mirroring e2e-ci.yml's
# list means this job is present on exactly the PRs that job is present on, so
# making it required adds no new class of stuck PR. If you narrow this list,
# check branch protection in the same change.
# ---------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "backend/**"
      - "api/**"
      - "scripts/generate_api_schema.sh"
      - ".github/workflows/landing-b-race.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/web/**"
      - "backend/**"
      - "api/**"
      - "scripts/generate_api_schema.sh"
      - ".github/workflows/landing-b-race.yml"
  workflow_dispatch:

permissions:
  contents: read

# Its own concurrency group, NOT e2e-ci's: this job is slower than the suite it
# sits beside and must not cancel it or be cancelled by it.
concurrency:
  group: landing-b-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: landing-b race (50 unretried attempts)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BACKEND_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # NOT OPTIONAL. The whole `landing B (/landing-b)` describe is skipped
      # unless this is exactly "1" (the spec's `test.describe.skip` at the top),
      # and a skip is green. Without it this job would run, report success and
      # execute zero assertions — the exact defect it exists to remove. The
      # census step below is what makes that impossible to ship unnoticed.
      PLAYWRIGHT_PROD_BUILD: "1"
      # How many instances this job must observe. Two viewports × --repeat-each.
      EXPECTED_INSTANCES: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # `next dev` CANNOT measure this page. A local dev run produced 11 false
      # reds on a commit that was clean in production; the spec's own header
      # says so and gates itself on PLAYWRIGHT_PROD_BUILD for the same reason.
      - name: Build (production)
        working-directory: apps/web
        run: pnpm build

      - name: Boot Next.js (production server)
        working-directory: apps/web
        run: |
          nohup pnpm start --port 3000 > ../../frontend-race.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "production server up after $i attempts"
              exit 0
            fi
            sleep 1
          done
          echo "production server failed to boot; tailing log:"
          tail -n 200 frontend-race.log || true
          exit 1

      # `--retries=0` is the point of this job. `--workers=4` is the condition
      # that reproduces. `--project=chromium` because the two timezone projects
      # only match demo/shell specs and would contribute nothing but a filter
      # that silently matches zero tests.
      - name: Run the race test, 50 unretried attempts under contention
        working-directory: apps/web
        run: |
          pnpm exec playwright test tests/e2e/landing-b.spec.ts \
            --project=chromium \
            --retries=0 \
            --workers=4 \
            --repeat-each=100 \
            -g "keeps its close control in frame"

      # -----------------------------------------------------------------------
      # THE POSITIVE CONTROL, and it is not ceremony.
      #
      # Two ways this job could report green having proved nothing, both of
      # which this repo has shipped before in other clothes:
      #
      #   · `-g` matches no test. Verified locally: the run then reports
      #     `expected: 0, unexpected: 0, skipped: 0` — a green-looking report
      #     over an empty set. A renamed test title is all it takes.
      #   · PLAYWRIGHT_PROD_BUILD goes missing, the describe skips, and every
      #     instance lands in `skipped`, which is not a failure.
      #
      # So the count is asserted, not assumed: exactly EXPECTED_INSTANCES tests
      # must have RUN, and none may have skipped. `if: always()` so a red run is
      # still audited for having measured the right number of things — but note
      # this step can only ADD a failure; the step above already failed the job
      # if the gate went red.
      # -----------------------------------------------------------------------
      - name: Census — the gate actually executed 50 instances
        if: always()
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            const path = "test-results/results.json";
            if (!fs.existsSync(path)) {
              console.error("::error::no Playwright JSON report at " + path + " — the run did not produce one, so the number of instances executed is unknown. A missing report is NOT zero and is not green.");
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(path, "utf8")).stats ?? {};
            const ran = (s.expected ?? 0) + (s.unexpected ?? 0) + (s.flaky ?? 0);
            const want = Number(process.env.EXPECTED_INSTANCES);
            console.log("expected=" + s.expected + " unexpected=" + s.unexpected + " flaky=" + s.flaky + " skipped=" + s.skipped + " ran=" + ran);
            let bad = false;
            if (s.skipped) {
              console.error("::error::" + s.skipped + " instances SKIPPED. The landing-b describe skips unless PLAYWRIGHT_PROD_BUILD=1, and a skip is green — this gate proved nothing.");
              bad = true;
            }
            if (ran !== want) {
              console.error("::error::the gate ran " + ran + " instances, not " + want + ". Either the -g filter no longer matches both viewports (a renamed test title does this, and it exits looking green) or --repeat-each changed without this number changing with it.");
              bad = true;
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-landing-b-race
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test-results (videos + traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-landing-b-race
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-landing-b-race
          path: frontend-race.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
