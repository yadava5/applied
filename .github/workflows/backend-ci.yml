name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      # `scripts/install.sh` and `scripts/start_backend.sh` used to be listed
      # here. Both existed only to bootstrap and boot the DESKTOP backend for
      # the SwiftUI app and were deleted with it (issue #73). A path filter that
      # names a file which cannot exist is a trigger that can never fire, which
      # is this repo's recurring defect — so they are removed, not commented out.
      #
      # The expand-only gate and the fingerprint it reads. Both live outside
      # backend/, so without these two lines a PR that edited only the gate
      # would never run the gate — the same shape as the `integration/web-
      # migration` branch below, where a job that could not trigger was
      # indistinguishable from a job that did not exist. Edit BOTH blocks.
      - "scripts/check_expand_only.py"
      - "scripts/schema_fingerprint.sql"
      # The other two gate scripts, by the same argument as the two lines
      # above and with them as the precedent. Since #620 both of these gates
      # have their own UNFILTERED workflow, so a PR changing one of these
      # scripts runs the gate itself — but never ran the tests that prove the
      # gate CAN FAIL. Those tests live under `backend/**`, so editing the TEST
      # ran this workflow while editing the GATE did not, which is the wrong
      # way round: the whole #615 hardening could be deleted and every check
      # would stay green.
      #
      # What goes unrun without these two lines is 59 tests —
      # `test_test_data_gate.py` (35) and `test_readme_facts_writer.py` (24).
      # They hold `--write` to not rewriting a digit belonging to a
      # NEIGHBOURING fact on the same README line (#468), hold `--check` to
      # refusing a half-merged file rather than calling it agreement, and hold
      # the address scanner to RAISING on a file it cannot read instead of
      # counting it clean.
      #
      # `scripts/check_test_data.py` was in this list until #620, and removing
      # it there was correct: it was listed to make the GATE fire on its own
      # source, and the gate now has an unfiltered workflow that does that
      # better. Making the gate's TESTS run is a different job. The removal did
      # not create this gap — it exposed one that had never been filled.
      #
      # The cost is real and is the reason to state it rather than smooth it
      # over: a PR touching only one of these two scripts now runs the
      # ~25-minute `test` job and its two Postgres services. The alternative is
      # a REQUIRED gate whose falsifiability tests never execute, which is this
      # repo's named recurring defect. Found on #621/#625, which changed only
      # `readme_facts.py` and ran no backend job at all. Edit BOTH blocks.
      - "scripts/check_test_data.py"
      - "scripts/readme_facts.py"
      # `apps/web/lib/gmail/types.ts`, by the same argument a fourth time.
      # `test_the_page_size_fits_gmails_minute.py` reads that file to check the
      # web client asks for the page size the server is tuned for — the client
      # is the party that LOOPS, so the server's careful default is a ceiling
      # it never applies on its own. Without this line the gate cannot fire on
      # the edit it exists to catch: a web-only PR "tidying" PAGE_SIZE from 99
      # back to 100 touches nothing under backend/, runs no backend job, and
      # silently costs a third of the mailbox read rate (a page is 20N + 5
      # units against 6,000 per minute, so 100 fits two pages in a minute where
      # 99 fits three). Found by a review of the gate itself, before it had
      # ever been relied on. Edit BOTH blocks.
      - "apps/web/lib/gmail/types.ts"
      # The post-migration RLS gate, by the same argument a third time and with
      # a worse starting point: until now it appeared in NO workflow's paths at
      # all — not this one, not db-migrate.yml — so editing the script that
      # decides whether production still has tenant isolation ran nothing
      # whatsoever. Since #668 it also has the first tests it has ever had
      # (`backend/tests/test_verify_rls_gate.py`), and those live under
      # `backend/**`, so without this line editing the TEST runs them while
      # editing the GATE does not. Same wrong way round as the pair above.
      #
      # It is deliberately NOT added to db-migrate.yml's paths, which is the
      # other place it could go. That workflow runs a real `alembic upgrade
      # head` against the production database; a filter there would start a
      # production migration every time somebody edited a test-only concern.
      # The protection that matters is these unit tests running on the PR.
      # Edit BOTH blocks.
      - "scripts/verify_rls.py"
      # The ROOT requirements.txt — the manifest Vercel installs for the
      # deployed function, and the one `expand-only` pip-installs below. It is
      # not under backend/, so until 2026-08-15 a PR that changed only this
      # file ran NO backend job at all: #300, #302 and #305 each touched
      # nothing else and show only CodeQL, gitleaks and README facts. Five
      # dependency merges landed on the deploy manifest unexercised, and the
      # first thing to notice would have been production. Same shape as the
      # dead `scripts/install.sh` filter above — a check that cannot fire.
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
      # The product branch. `rls-postgres` was added on 2026-07-31 and pushed,
      # and had still never executed on 2026-08-02 — because every commit since
      # has landed here, and this branch was not in this list. A job that cannot
      # trigger is indistinguishable from a job that does not exist, and the
      # whole point of that job is that a silently-skipped security suite is
      # green. It was being silently NOT RUN instead, which is worse.
      - integration/web-migration
    paths:
      - "backend/**"
      - "scripts/check_expand_only.py"
      - "scripts/schema_fingerprint.sql"
      - "scripts/check_test_data.py"
      - "scripts/readme_facts.py"
      # `apps/web/lib/gmail/types.ts`, by the same argument a fourth time.
      # `test_the_page_size_fits_gmails_minute.py` reads that file to check the
      # web client asks for the page size the server is tuned for — the client
      # is the party that LOOPS, so the server's careful default is a ceiling
      # it never applies on its own. Without this line the gate cannot fire on
      # the edit it exists to catch: a web-only PR "tidying" PAGE_SIZE from 99
      # back to 100 touches nothing under backend/, runs no backend job, and
      # silently costs a third of the mailbox read rate (a page is 20N + 5
      # units against 6,000 per minute, so 100 fits two pages in a minute where
      # 99 fits three). Found by a review of the gate itself, before it had
      # ever been relied on. Edit BOTH blocks.
      - "apps/web/lib/gmail/types.ts"
      # The RLS gate — see the note in the pull_request block, including why it
      # is not also on db-migrate.yml's list.
      - "scripts/verify_rls.py"
      # The other half of the pair — see the note in the pull_request block.
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TIMEOUTS ARE ON THE STEPS, NOT THE JOB, AND THAT IS THE WHOLE POINT (#702).
  # A job-level `timeout-minutes` ends the job `conclusion: cancelled` — the
  # SAME conclusion `cancel-in-progress` produces every time a newer push
  # supersedes a run, which happens routinely here under strict up-to-date
  # protection. A job budget would therefore have made a hang LESS legible, not
  # more, by hiding it among ordinary supersedes.
  #
  # Measured on this repository's own CI rather than assumed (run 33704966798,
  # two jobs differing in one variable):
  #     job-level  timeout-minutes -> conclusion=cancelled
  #     step-level timeout-minutes -> conclusion=failure
  # So a step budget is a red, gated, unambiguous failure, and a supersede stays
  # `cancelled`. Two conclusions, two meanings.
  #
  # Budgets are ~1.5x the observed max for the long step and deliberately loose
  # for the network-bound installs; over eight runs on main, `Run tests` peaked
  # at 30.4 min and every install at 1.2 min. They bound a HANG, they do not
  # police normal variance. When one fires, profile the step — do not raise the
  # budget, which only lets the stall eat more.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        timeout-minutes: 8
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      # Ruff lint. Configured in pyproject.toml ([tool.ruff]) since the project
      # was set up, but it had never run in CI. Advisory (continue-on-error):
      # the first run on 2026-08-07 reported 379 errors across the configured
      # rule set (E,W,F,I,B,C4,UP,ARG,SIM) in tracked source under jobtracker/,
      # tests/ and alembic/. A gate that is red from birth gets ignored or
      # deleted; this one reports the count on every run and flips to blocking
      # (drop continue-on-error) once it reaches zero. Do NOT `--fix` here or
      # loosen pyproject to force it green. Placed before "Run tests" so the
      # advisory numbers still appear on builds where a later blocking step fails.
      - name: Run ruff lint (advisory until clean)
        timeout-minutes: 10
        continue-on-error: true
        run: ruff check .

      # Mypy strict type-check. pyproject sets [tool.mypy] strict = true with the
      # pydantic plugin, but it had never run in CI either. Advisory: the first
      # run on 2026-08-07 reported 879 errors in 65 of 92 checked files
      # (jobtracker/ 561, tests/ 286, alembic/ 32) — expected when a strict
      # config is enforced for the first time on a codebase that grew without it.
      # Reports the count each run; flip to blocking when it hits zero. Do NOT
      # add blanket `# type: ignore` or relax the config to pass.
      - name: Run mypy strict (advisory until clean)
        timeout-minutes: 10
        continue-on-error: true
        run: mypy .

      # Dependency audit of the deployment surface (requirements.txt), the set
      # that actually ships to Vercel. `-r requirements.txt` forces a real
      # resolution rather than osv-scanner's worst-case floor scan — see the
      # rationale in requirements-dev.txt. Advisory and REPORT-only by policy:
      # findings are upstream CVEs, not code to fix, and versions are NOT bumped
      # reflexively to silence it. On 2026-08-07 it reported 8 known
      # vulnerabilities in 2 packages (cryptography, transformers). Note: torch
      # is installed out-of-band from the CPU index and is not in
      # requirements.txt, so this audit does not cover it.
      - name: Run pip-audit on deployment surface (advisory)
        timeout-minutes: 10
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Run tests
        timeout-minutes: 45
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        # --cov puts the coverage figure in a PUBLIC run log on every push.
        # The portfolio cites this number; until now the only record of it
        # was a README line and a local run, which is not evidence anyone
        # else can check. No artifact is committed -- the run log is the
        # artifact, and it regenerates itself.
        run: pytest tests -q --cov=jobtracker --cov-report=term

      - name: Run classifier non-regression gate (rules v3)
        timeout-minutes: 15
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -m jobtracker.scripts.evaluate_classifier \
            --mode rules \
            --dataset data/evaluation/classifier_eval_v3.jsonl \
            --baseline data/evaluation/baseline_rules_v3.json \
            --tolerance 0.001 \
            --min-macro-f1 0.95

      - name: Run hybrid benchmark gate (v3 deterministic)
        timeout-minutes: 20
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -m jobtracker.scripts.evaluate_classifier \
            --mode hybrid \
            --dataset data/evaluation/classifier_eval_v3.jsonl \
            --baseline data/evaluation/baseline_hybrid_v3.json \
            --hybrid-profile deterministic \
            --min-macro-f1 0.95 \
            --tolerance 0.001

  rls-postgres:
    # tests/test_rls_postgres.py proves tenant isolation at the DATABASE layer:
    # a non-BYPASSRLS role, FORCE'd policies, and the real
    # jobtracker.database.connection machinery. Applied's RLS is live in
    # production, so this is the suite that backs that claim.
    #
    # It has never run in CI. The `test` job has no Postgres, so
    # JOBTRACKER_TEST_PG_ADMIN_URL is unset there and all ten tests skip — and a
    # skip is green. Hence a separate job with its own service container: it
    # needs the service anyway, and the separation also keeps it clear of the
    # importlib.reload(jobtracker.config) that four sibling modules perform.
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # postgres:17, matching production's 17.6. Bumped from 16 for issue
        # #691, which adds `tests/test_verify_rls_gate_postgres.py` to this
        # job: that module executes `scripts/verify_rls.py`'s own catalog
        # queries, and they read `pg_class.relacl`, where the owner's
        # privilege set differs between majors (`MAINTAIN` exists on 17 and
        # not on 16). A gate whose whole subject is what the catalog says
        # should be read against the catalog production actually has.
        #
        # This moves the RLS and migration suites above onto 17 as well. Both
        # were re-run against a postgres:17 container before the bump landed.
        # The `expand-only` job below stays on 16 on purpose; the reason is on
        # its own service block.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        timeout-minutes: 8
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Run RLS enforcement suite
        timeout-minutes: 20
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
          # The `+asyncpg` scheme is required, not cosmetic: the app's engine is
          # created with create_async_engine, and a bare `postgresql://` URL
          # fails with "The asyncio extension requires an async driver".
          # asyncpg is already a runtime dependency; psycopg2 is NOT needed.
          JOBTRACKER_TEST_PG_ADMIN_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          pytest tests/test_rls_postgres.py -q \
            --junit-xml="$RUNNER_TEMP/rls-results.xml"

      - name: Assert the RLS suite actually ran
        # Without this, a wrong or missing JOBTRACKER_TEST_PG_ADMIN_URL turns
        # the whole suite back into "10 skipped" — which pytest exits 0 on, and
        # which is precisely the dead coverage this job exists to end.
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "rls-results.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"RLS enforcement suite: {total} tests, {skipped} skipped")
          if total == 0 or skipped:
              sys.exit(
                  "RLS enforcement tests did not run. Tenant isolation is "
                  "UNVERIFIED by this build."
              )
          PY

      - name: Run migration suite (real Postgres)
        timeout-minutes: 20
        # tests/test_migrations_postgres.py applies the WHOLE Alembic chain to a
        # bare database and checks what the SQLite suites structurally cannot:
        # enum labels. `sa.Enum` renders as VARCHAR on SQLite, so a migration
        # that adds the wrong label — the lowercase API value instead of the
        # member NAME Postgres actually stores — passes 600 green tests and then
        # 500s on the first write in production. It runs here because this is
        # the job with a Postgres; it is NOT in the `test` job for the same
        # reason the RLS suite is not.
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
          JOBTRACKER_TEST_PG_ADMIN_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          pytest tests/test_migrations_postgres.py -q \
            --junit-xml="$RUNNER_TEMP/migration-results.xml"

      - name: Assert the migration suite actually ran
        # Same guard, same reason: this module skips itself when no Postgres is
        # reachable, and a skip is green.
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(
              os.path.join(os.environ["RUNNER_TEMP"], "migration-results.xml")
          ).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"Migration suite: {total} tests, {skipped} skipped")
          if total == 0 or skipped:
              sys.exit(
                  "Migration tests did not run. Every enum label in the chain is "
                  "UNVERIFIED by this build."
              )
          PY

      - name: Run the RLS gate's own SQL against a real Postgres
        timeout-minutes: 20
        # tests/test_verify_rls_gate_postgres.py runs scripts/verify_rls.py —
        # the post-migration gate — against a database the real Alembic chain
        # built. Until issue #691 that script's queries had exactly ONE
        # execution site, db-migrate.yml, against PRODUCTION: reverting the
        # grant query's relkind widening, which re-opens an anon-granted view
        # over `applications`, reddened zero of its thirteen unit tests,
        # because those exercise a pure function over query RESULTS and never
        # see a relkind. It runs here because this is the job with a Postgres,
        # for the same reason the two suites above are not in `test`.
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
          JOBTRACKER_TEST_PG_ADMIN_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          pytest tests/test_verify_rls_gate_postgres.py -q \
            --junit-xml="$RUNNER_TEMP/verify-rls-results.xml"

      - name: Assert the RLS gate's SQL suite actually ran
        # Third instance of the same guard, and the one with the most to lose:
        # this module skips itself when no Postgres is reachable, a skip is
        # green, and what would silently go unverified is the check that
        # decides whether production still has tenant isolation.
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(
              os.path.join(os.environ["RUNNER_TEMP"], "verify-rls-results.xml")
          ).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"RLS gate SQL suite: {total} tests, {skipped} skipped")
          if total == 0 or skipped:
              sys.exit(
                  "The RLS gate's SQL did not run. Nothing in this build "
                  "executed scripts/verify_rls.py's queries against a database."
              )
          PY

  expand-only:
    # Refuses a revision that removes or narrows something without declaring it.
    #
    # A push to main starts `DB migrate` AND a Vercel deploy at the same moment
    # and nothing orders them. Additive revisions survive that race — old code
    # ignores a column it does not select. Destructive ones cannot: the old code
    # is still serving when the column disappears, so there is no ordering in
    # which one merge is safe. docs/MIGRATIONS.md has said so since the runner
    # landed; this is what measures it.
    #
    # scripts/check_expand_only.py walks the chain one revision at a time
    # against this service container, fingerprints the schema after each step
    # with scripts/schema_fingerprint.sql, and fails on: a dropped column, a
    # changed type, nullable -> NOT NULL, a dropped table, a dropped enum label.
    # A revision that means it declares a module-level CONTRACT_STEP saying why.
    #
    # Deliberately NOT `needs: test`, unlike the two jobs around it. This job
    # answers a question about the diff, not about whether the application's
    # tests pass, and chaining it would hide "this schema change cannot be
    # merged in one PR" behind an unrelated red until somebody fixed that first.
    #
    # It installs the ROOT requirements.txt plus backend/requirements-migrate.txt
    # — the same pair db-migrate.yml uses, i.e. the environment a real migration
    # runs in — rather than backend/requirements-dev.txt, which drags ~800 MB of
    # torch along for a job that needs alembic and psycopg.
    runs-on: ubuntu-latest

    services:
      postgres:
        # Deliberately still 16 while `rls-postgres` above moved to 17. Every
        # comparison this job makes is WITHIN one run — each revision's
        # fingerprint against the previous revision's, on this same server —
        # so parity with production's major buys it nothing here, while a
        # major bump risks a fingerprint delta that has nothing to do with the
        # change under review. Bump it when it has a reason of its own.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements-migrate.txt

      - name: Install migration dependencies
        timeout-minutes: 8
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements-migrate.txt

      - name: Walk the chain, one revision at a time
        timeout-minutes: 20
        env:
          JOBTRACKER_ENVIRONMENT: test
          # Plain `postgresql://` — the script normalises it to
          # `postgresql+psycopg` for env.py and to libpq form for psycopg.
          # DIRECT_URL is deliberately not what this reads: the script drops and
          # rebuilds the public schema, so it refuses production's variable name
          # and refuses any host that is not loopback.
          JOBTRACKER_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: python scripts/check_expand_only.py

  cloud-smoke:
    # Smoke-test the cloud FastAPI entrypoint (`api/index.py` /
    # `jobtracker.main_cloud`) under the exact env used on Vercel:
    # `JOBTRACKER_DEPLOYMENT=cloud`. Asserts that (a) the app imports
    # without pulling keyring / aiosqlite / torch / setfit, and (b) the
    # pytest suite in `tests/test_main_cloud.py` passes. Runs after the
    # main `test` job so CI fails fast on the broader pytest failures
    # before spending cycles here.
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        timeout-minutes: 8
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Import cloud app under cloud deployment
        timeout-minutes: 10
        env:
          JOBTRACKER_DEPLOYMENT: cloud
          JOBTRACKER_CORS_ALLOWED_HOSTS: jobtracker.app
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -c "
          import asyncio
          from httpx import ASGITransport, AsyncClient
          from jobtracker.main_cloud import app

          async def probe():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://cloud-smoke') as client:
                  response = await client.get('/health')
              assert response.status_code == 200, response.status_code
              payload = response.json()
              assert payload['status'] == 'ok', payload
              assert payload['deployment'] == 'cloud', payload
              print('cloud /health OK:', payload)

          asyncio.run(probe())
          "

      - name: Run cloud pytest suite
        timeout-minutes: 15
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: pytest tests/test_main_cloud.py -q
