name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/install.sh"
      - "scripts/start_backend.sh"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "scripts/install.sh"
      - "scripts/start_backend.sh"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: pytest tests -q

      - name: Run classifier non-regression gate (rules v3)
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -m jobtracker.scripts.evaluate_classifier \
            --mode rules \
            --dataset data/evaluation/classifier_eval_v3.jsonl \
            --baseline data/evaluation/baseline_rules_v3.json \
            --tolerance 0.001 \
            --min-macro-f1 0.95

      - name: Run hybrid benchmark gate (v3 deterministic)
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -m jobtracker.scripts.evaluate_classifier \
            --mode hybrid \
            --dataset data/evaluation/classifier_eval_v3.jsonl \
            --baseline data/evaluation/baseline_hybrid_v3.json \
            --hybrid-profile deterministic \
            --min-macro-f1 0.95 \
            --tolerance 0.001

  cloud-smoke:
    # Smoke-test the cloud FastAPI entrypoint (`api/index.py` /
    # `jobtracker.main_cloud`) under the exact env used on Vercel:
    # `JOBTRACKER_DEPLOYMENT=cloud`. Asserts that (a) the app imports
    # without pulling keyring / aiosqlite / torch / setfit, and (b) the
    # pytest suite in `tests/test_main_cloud.py` passes. Runs after the
    # main `test` job so CI fails fast on the broader pytest failures
    # before spending cycles here.
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Import cloud app under cloud deployment
        env:
          JOBTRACKER_DEPLOYMENT: cloud
          JOBTRACKER_CORS_ALLOWED_HOSTS: jobtracker.app
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -c "
          import asyncio
          from httpx import ASGITransport, AsyncClient
          from jobtracker.main_cloud import app

          async def probe():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://cloud-smoke') as client:
                  response = await client.get('/health')
              assert response.status_code == 200, response.status_code
              payload = response.json()
              assert payload['status'] == 'ok', payload
              assert payload['deployment'] == 'cloud', payload
              print('cloud /health OK:', payload)

          asyncio.run(probe())
          "

      - name: Run cloud pytest suite
        env:
          JOBTRACKER_ENVIRONMENT: test
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: pytest tests/test_main_cloud.py -q
