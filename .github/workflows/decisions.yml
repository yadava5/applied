name: Decisions

# Its own workflow and UNFILTERED, for the reason `test-data.yml`'s header
# gives at length: a path-filtered workflow produces no context at all on a
# pull request that touches none of its paths, so if this is ever added to
# branch protection a docs-only change would wedge. It is not a required
# context today -- that is the owner's call, one setting -- and the job name
# below is the string protection would match, so it must not be renamed.
#
# Cost is not a reason to filter it: the checker is stdlib Python over
# `git ls-files` with no install, no network and no database.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decisions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Refuses a `docs/DECISIONS.md` that has gone stale in the three ways a
    # script can see: a missing field, an `Enforced by:` citing a file that no
    # longer exists, and a DEC marker that has lost its entry or an entry whose
    # marker has left the file it names. What it cannot see is written at the
    # top of the document rather than left implied.
    name: Decision record agrees with the tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Refuse a decision record that disagrees with the tree
        timeout-minutes: 5
        run: python3 scripts/check_decisions.py
