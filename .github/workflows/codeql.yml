name: CodeQL

# Static analysis for every language actually present in this repository.
# Results land in the Security tab and, on a public repo, are visible to anyone
# reading the project -- which is the point: a scan nobody can see proves
# nothing to a reader.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the queries improve even when the code does not. A finding
    # can appear in unchanged code the week after a new query ships.
    - cron: '0 3 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read
  packages: read

jobs:
  # Budgets live on the STEPS, not the job (#702, #712). A job-level
  # `timeout-minutes` ends the job `conclusion: cancelled` — the same
  # conclusion a supersede or a manual cancel produces — so a hang would
  # hide among routine traffic; a step budget fails red. Measured in run
  # 33704966798; the full note is in backend-ci.yml.
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      # One language failing should not hide the results for the others.
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        timeout-minutes: 10
        with:
          languages: ${{ matrix.language }}

      # NOT 1.5x-of-max. Over 8 successful runs this step ranged 0.7 -> 1.7 min,
      # a 2.5x spread within the sample, and analysis time grows with the
      # codebase. 1.5x of the max would police that variance rather than bound
      # a hang; 10 bounds the hang (a stalled query-pack fetch) and nothing else.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        timeout-minutes: 10
        with:
          category: "/language:${{ matrix.language }}"
