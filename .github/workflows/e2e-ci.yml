name: E2E CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "backend/**"
      - "api/**"
      # The schema drift gate's generator. A change to it that is not also a
      # change under apps/web or backend would otherwise never be exercised.
      - "scripts/generate_api_schema.sh"
      - ".github/workflows/e2e-ci.yml"
      # The browser-install action these jobs depend on. Without this, an edit
      # to it alone would ship untested by the only jobs that run it.
      - ".github/actions/playwright-browsers/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/web/**"
      - "backend/**"
      - "api/**"
      # The schema drift gate's generator. A change to it that is not also a
      # change under apps/web or backend would otherwise never be exercised.
      - "scripts/generate_api_schema.sh"
      - ".github/workflows/e2e-ci.yml"
      # The browser-install action these jobs depend on. Without this, an edit
      # to it alone would ship untested by the only jobs that run it.
      - ".github/actions/playwright-browsers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Budgets live on the STEPS, not the job (#702, #712). A job-level
  # `timeout-minutes` ends the job `conclusion: cancelled` — the same
  # conclusion a supersede or a manual cancel produces — so a hang would
  # hide among routine traffic; a step budget fails red. Measured in run
  # 33704966798; the full note is in backend-ci.yml.
  playwright:
    runs-on: ubuntu-latest

    # Placeholder env so both `next build` and `next dev`'s initial route
    # compilation succeed without a real Supabase project. The test only
    # renders `/login` and asserts the form is present — it never
    # actually auths against Supabase.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BACKEND_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      JOBTRACKER_ENVIRONMENT: test
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      # The switch that turns "no Supabase session, so 13 tests skipped" from a
      # silent green into a red job (#188). Read from a REPOSITORY VARIABLE so
      # the owner can enforce it the day a seeded test account exists — one
      # setting, no code change. Unset it evaluates to the empty string, and
      # `tests/e2e/session.ts` only enforces on the exact string "1", so leaving
      # it unset is inert.
      E2E_REQUIRE_SESSION: ${{ vars.E2E_REQUIRE_SESSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        timeout-minutes: 8
        working-directory: backend
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 5
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # API SCHEMA DRIFT GATE
      #
      # `apps/web/lib/api/schema.d.ts` is the ONLY compile-time contract the web
      # app has with the backend, and for months it was not generated at all: a
      # 180-line file written by hand, covering 4 of the 20 paths the cloud app
      # serves. Regenerating produced 2018 lines, i.e. total drift — and one of
      # the shapes it got wrong (`split_candidates[].position`, which nobody
      # sends; the field is `role`) had already shipped a feature that could
      # never render (#100).
      #
      # This job is where the gate is cheap: Python 3.11, the backend
      # dependencies and `openapi-typescript` are all installed above, so it
      # costs seconds. It runs BEFORE the Playwright browser download so a
      # stale contract fails fast.
      #
      # Generated from `jobtracker.main_cloud` — the app `api/index.py` serves
      # on Vercel, and now the only FastAPI app in the tree. This job used to
      # boot the desktop `jobtracker.main` on :8000 alongside it, which served a
      # different contract; that app was deleted with the desktop routers (#73).
      #
      # If a fastapi / pydantic upgrade changes the emitted document this goes
      # red. Regenerate and commit the result; do not suppress it.
      # -----------------------------------------------------------------------
      - name: Regenerate the web API schema from the cloud app
        timeout-minutes: 5
        run: ./scripts/generate_api_schema.sh

      - name: Fail if the committed API schema drifted
        run: |
          if ! git diff --exit-code apps/web/lib/api/schema.d.ts; then
            echo "::error file=apps/web/lib/api/schema.d.ts::The committed OpenAPI bindings no longer match jobtracker.main_cloud. Run 'pnpm -C apps/web api:gen' and commit the result."
            exit 1
          fi

      # Browsers come from the ~/.cache/ms-playwright cache, keyed on the
      # version `apps/web/pnpm-lock.yaml` resolves; nothing here runs apt-get.
      # That is the fix for the two 2026-08-19 stalls in which `--with-deps` sat
      # on a silent archive.ubuntu.com until `timeout-minutes` killed the job
      # with zero tests run — see
      # `.github/actions/playwright-browsers/action.yml` for the full story.
      #
      # The BOUND is the action's own per-attempt `timeout(1)` — 3 x 120 s plus
      # backoff, ~6.5 min worst case — which fails the step red. The
      # `timeout-minutes: 8` here is only a cap above that worst case, and
      # whether GitHub enforces it on a step that `uses:` a COMPOSITE action is
      # not something we have seen fire; do not rely on it, and do not raise it.
      # A cap kill would report `cancelled`, i.e. UNSTABLE rather than red —
      # which is precisely why the script's own timeout must be the one to fire.
      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        timeout-minutes: 8
        with:
          working-directory: apps/web

      # -----------------------------------------------------------------------
      # NO BACKEND IS BOOTED HERE ANY MORE.
      #
      # This job used to run `uvicorn jobtracker.main:app` on :8000. That was
      # the DESKTOP app, which was deleted along with the unmounted, unscoped
      # desktop routers (issue #73) when `apps/macos` was de-scoped. It is not
      # being replaced by `main_cloud` on :8000, and that is deliberate.
      #
      # The desktop app never served the contract the web app calls. The schema
      # generator says so in its own header: ":8000 is the DESKTOP app, which
      # serves a different contract". So any request that had reached it would
      # have got the wrong shape, not the right one.
      #
      # The evidence that nothing here needed it is the sibling job below.
      # `playwright-production` runs the SAME suite — `pnpm exec playwright
      # test`, no `--project` filter — with the same `BACKEND_API_URL` pointing
      # at a :8000 that has nothing on it, and it is green. Every route these
      # specs visit is either public or redirects at the protected layout before
      # any API call, and the 13 session-gated tests skip for want of a Supabase
      # session (see the census step below) rather than for want of a server.
      #
      # The Python setup and backend install above stay: the API schema drift
      # gate imports `jobtracker.main_cloud` and needs them.
      #
      # If a spec is ever written that DOES need a live backend, boot
      # `jobtracker.main_cloud` here with a real JOBTRACKER_SUPABASE_JWT_SECRET
      # — and expect it to need the seeded test account that #188 is about.
      # -----------------------------------------------------------------------

      - name: Boot Next.js (dev)
        working-directory: apps/web
        run: |
          nohup pnpm dev --port 3000 > ../../frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "frontend up after $i attempts"
              exit 0
            fi
            sleep 1
          done
          echo "frontend failed to boot; tailing log:"
          tail -n 200 frontend.log || true
          exit 1

      # NO `--project` filter, deliberately. `playwright.config.ts` declares
      # three projects — chromium at UTC, plus two that re-run `demo.spec.ts`
      # at fixed DST-free offsets of opposite sign (UTC−10 / UTC+14) so that at
      # whatever hour this job fires, one of them has a local calendar day
      # differing from UTC and drives the post-hydration day swap. A UTC-only
      # runner never enters that window, so /demo's calendar-day assertions
      # cannot go red there whatever the code does. Naming `--project=chromium`
      # here would skip both and restore exactly that; see the long note above
      # `projects` in that file, including what these projects do NOT cover.
      # 14 = ~1.5x the observed max. Over the last 8 successful runs on main
      # this step peaked at 9.3 min (median 8.8). The job used to carry 25
      # minutes and both 2026-08-19 stalls burned all of it in the browser
      # install above while reporting `cancelled`; this fails red instead.
      - name: Run Playwright tests
        timeout-minutes: 14
        working-directory: apps/web
        run: pnpm exec playwright test

      # -----------------------------------------------------------------------
      # THE NO-SESSION CENSUS (#188)
      #
      # 13 tests across four spec files need an authenticated Supabase session,
      # and this job boots against a placeholder project — so all 13 skip, on
      # every run, and a skip is green. That is how PR #184 merged with none of
      # the signed-in coverage having executed, and how #163 (two
      # `aria-current="page"` elements on /inbox) shipped underneath an assertion
      # written to catch it.
      #
      # The gap is not closed here — closing it needs a seeded test account,
      # which is the owner's decision. What this does is publish the NUMBER
      # where it cannot be missed: the job summary, visible in the PR checks UI
      # without opening a log.
      #
      # `if: always()` so it also reports on a red run. The script exits 0 on
      # EVERY path, including a missing report, so it can neither fail this job
      # nor mask the Playwright step above — a failed step still fails the job.
      # A missing report is announced loudly rather than counted as zero: this
      # repo has shipped "0 matches" checks that could not fail more than once,
      # and a census is exactly the shape that goes wrong that way.
      # -----------------------------------------------------------------------
      - name: Census — coverage that did not run for want of a session
        if: always()
        working-directory: apps/web
        run: node scripts/no-session-census.mjs test-results/results.json "playwright (dev server)"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test-results (videos + traces)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs
          # `backend.log` is gone with the backend boot; nothing writes it now,
          # and `if-no-files-found: ignore` would have hidden that rather than
          # reporting it. One server, one log.
          path: frontend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi

  # ---------------------------------------------------------------------------
  # The job above proves the app works under `next dev`. Users never load that.
  #
  # A dev server renders every route per request, so it cannot reproduce the
  # static-prerender path — which is precisely where the `/demo` hydration
  # defect (#418) lived: the build day's dates were frozen into the HTML while
  # the client resolved "today" at view time. CI ran a browser and still could
  # not see it; it took a manual pass. This job closes that gap by building the
  # app the way Vercel does and driving the real server.
  #
  # Deliberately no backend here. Every route this job visits either is public
  # or redirects at the protected layout before any API call, so booting FastAPI
  # (and installing torch) would add minutes to catch nothing. If a route ever
  # does need it, it will 500 and `production.spec.ts` fails on the 5xx hook.
  # ---------------------------------------------------------------------------
  playwright-production:
    name: playwright (production build)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BACKEND_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # The switch that un-skips tests/e2e/production.spec.ts.
      PLAYWRIGHT_PROD_BUILD: "1"
      # …and the unrelated one that would un-skip the 13 session-gated tests by
      # making them fail instead. Same repository variable as the job above, so
      # one setting governs both; inert while unset. See #188 and
      # `apps/web/tests/e2e/session.ts` — and note these two switches answer
      # different questions and must not be conflated.
      E2E_REQUIRE_SESSION: ${{ vars.E2E_REQUIRE_SESSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        timeout-minutes: 5
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # Cached, apt-free browser install. The bound is the action's own
      # per-attempt `timeout(1)`; the 8-minute cap merely sits above it. See
      # `.github/actions/playwright-browsers/action.yml`.
      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        timeout-minutes: 8
        with:
          working-directory: apps/web

      - name: Build (production)
        timeout-minutes: 5
        working-directory: apps/web
        run: pnpm build

      - name: Boot Next.js (production server)
        working-directory: apps/web
        run: |
          nohup pnpm start --port 3000 > ../../frontend-prod.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "production server up after $i attempts"
              exit 0
            fi
            sleep 1
          done
          echo "production server failed to boot; tailing log:"
          tail -n 200 frontend-prod.log || true
          exit 1

      # Again no `--project` filter — and this is the job where it matters
      # most. The race the offset projects exist for is a HYDRATION-adjacent
      # defect, and only this job hydrates a real static prerender; the dev
      # server re-renders every route per request. Same reasoning as the note
      # in the job above.
      # 15 = ~1.5x the observed max of 9.7 min over the last 8 successful runs.
      - name: Run Playwright against the production build
        timeout-minutes: 15
        working-directory: apps/web
        run: pnpm exec playwright test

      # Same census as the dev-server job, and it must report the SAME NUMBER
      # on both. This job satisfies `PLAYWRIGHT_PROD_BUILD`, so
      # production.spec.ts's 12 skips do not happen here — and because the
      # count is prefix-matched to `tests/e2e/session.ts` rather than taken
      # from the skip total, that difference cannot move the number. A total
      # that means one thing on one job and another on the other would be the
      # very ambiguity this step exists to remove.
      #
      # THE LITERAL "13" WAS WRONG HERE, corrected 2026-08-21 against a full
      # production run that reported 28. `shell.spec.ts` joined
      # `DAY_DEPENDENT_SPECS` at some point and tripled its own 6 to 18. The
      # census itself was right the whole time; only this comment was stale,
      # which is the worse failure of the two — a reader checking the run
      # against the prose would have "corrected" a working count. The
      # invariant is that the two jobs AGREE, and that is what this says now,
      # because a hardcoded expectation in a comment nothing executes is a
      # claim with no gate behind it.
      - name: Census — coverage that did not run for want of a session
        if: always()
        working-directory: apps/web
        run: node scripts/no-session-census.mjs test-results/results.json "playwright (production build)"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-production
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs-production
          path: frontend-prod.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
