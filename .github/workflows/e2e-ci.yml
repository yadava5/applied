name: E2E CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "backend/**"
      - "api/**"
      # The schema drift gate's generator. A change to it that is not also a
      # change under apps/web or backend would otherwise never be exercised.
      - "scripts/generate_api_schema.sh"
      - ".github/workflows/e2e-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/web/**"
      - "backend/**"
      - "api/**"
      # The schema drift gate's generator. A change to it that is not also a
      # change under apps/web or backend would otherwise never be exercised.
      - "scripts/generate_api_schema.sh"
      - ".github/workflows/e2e-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Placeholder env so both `next build` and `next dev`'s initial route
    # compilation succeed without a real Supabase project. The test only
    # renders `/login` and asserts the form is present — it never
    # actually auths against Supabase.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BACKEND_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      JOBTRACKER_ENVIRONMENT: test
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # API SCHEMA DRIFT GATE
      #
      # `apps/web/lib/api/schema.d.ts` is the ONLY compile-time contract the web
      # app has with the backend, and for months it was not generated at all: a
      # 180-line file written by hand, covering 4 of the 20 paths the cloud app
      # serves. Regenerating produced 2018 lines, i.e. total drift — and one of
      # the shapes it got wrong (`split_candidates[].position`, which nobody
      # sends; the field is `role`) had already shipped a feature that could
      # never render (#100).
      #
      # This job is where the gate is cheap: Python 3.11, the backend
      # dependencies and `openapi-typescript` are all installed above, so it
      # costs seconds. It runs BEFORE the Playwright browser download so a
      # stale contract fails fast.
      #
      # Generated from `jobtracker.main_cloud` — the app `api/index.py` serves
      # on Vercel — NOT the desktop `jobtracker.main` this job boots on :8000
      # for the browser tests. Those are different contracts.
      #
      # If a fastapi / pydantic upgrade changes the emitted document this goes
      # red. Regenerate and commit the result; do not suppress it.
      # -----------------------------------------------------------------------
      - name: Regenerate the web API schema from the cloud app
        run: ./scripts/generate_api_schema.sh

      - name: Fail if the committed API schema drifted
        run: |
          if ! git diff --exit-code apps/web/lib/api/schema.d.ts; then
            echo "::error file=apps/web/lib/api/schema.d.ts::The committed OpenAPI bindings no longer match jobtracker.main_cloud. Run 'pnpm -C apps/web api:gen' and commit the result."
            exit 1
          fi

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot backend (uvicorn)
        working-directory: backend
        run: |
          nohup python -m uvicorn jobtracker.main:app \
            --host 127.0.0.1 --port 8000 \
            > ../backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "backend up after $i attempts"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to boot; tailing log:"
          tail -n 200 backend.log || true
          exit 1

      - name: Boot Next.js (dev)
        working-directory: apps/web
        run: |
          nohup pnpm dev --port 3000 > ../../frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "frontend up after $i attempts"
              exit 0
            fi
            sleep 1
          done
          echo "frontend failed to boot; tailing log:"
          tail -n 200 frontend.log || true
          exit 1

      # NO `--project` filter, deliberately. `playwright.config.ts` declares
      # three projects — chromium at UTC, plus two that re-run `demo.spec.ts`
      # at fixed DST-free offsets of opposite sign (UTC−10 / UTC+14) so that at
      # whatever hour this job fires, one of them has a local calendar day
      # differing from UTC and drives the post-hydration day swap. A UTC-only
      # runner never enters that window, so /demo's calendar-day assertions
      # cannot go red there whatever the code does. Naming `--project=chromium`
      # here would skip both and restore exactly that; see the long note above
      # `projects` in that file, including what these projects do NOT cover.
      - name: Run Playwright tests
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test-results (videos + traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          if [ -n "${BACKEND_PID:-}" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi

  # ---------------------------------------------------------------------------
  # The job above proves the app works under `next dev`. Users never load that.
  #
  # A dev server renders every route per request, so it cannot reproduce the
  # static-prerender path — which is precisely where the `/demo` hydration
  # defect (#418) lived: the build day's dates were frozen into the HTML while
  # the client resolved "today" at view time. CI ran a browser and still could
  # not see it; it took a manual pass. This job closes that gap by building the
  # app the way Vercel does and driving the real server.
  #
  # Deliberately no backend here. Every route this job visits either is public
  # or redirects at the protected layout before any API call, so booting FastAPI
  # (and installing torch) would add minutes to catch nothing. If a route ever
  # does need it, it will 500 and `production.spec.ts` fails on the 5xx hook.
  # ---------------------------------------------------------------------------
  playwright-production:
    name: playwright (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BACKEND_API_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # The switch that un-skips tests/e2e/production.spec.ts.
      PLAYWRIGHT_PROD_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (production)
        working-directory: apps/web
        run: pnpm build

      - name: Boot Next.js (production server)
        working-directory: apps/web
        run: |
          nohup pnpm start --port 3000 > ../../frontend-prod.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "production server up after $i attempts"
              exit 0
            fi
            sleep 1
          done
          echo "production server failed to boot; tailing log:"
          tail -n 200 frontend-prod.log || true
          exit 1

      # Again no `--project` filter — and this is the job where it matters
      # most. The race the offset projects exist for is a HYDRATION-adjacent
      # defect, and only this job hydrates a real static prerender; the dev
      # server re-renders every route per request. Same reasoning as the note
      # in the job above.
      - name: Run Playwright against the production build
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-production
          path: frontend-prod.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
