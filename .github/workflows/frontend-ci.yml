name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
      # `booklet/` is not this app, but the unit suite below GATES it.
      # `apps/web/tests/unit/no-real-employer-in-shipped-fixtures.test.mjs`
      # declares five scan roots and two of them — `booklet/src/` and the built
      # card it produces — are outside `apps/web/**`. Without this line a PR
      # that edited only `booklet/src/content.ts` would never run the gate that
      # exists to check it, which is the same shape as the two entries
      # `backend-ci.yml` carries for its own out-of-tree gate scripts and the
      # `scripts/generate_api_schema.sh` line in `e2e-ci.yml`: a job that cannot
      # trigger is indistinguishable from a job that does not exist.
      #
      # `apps/web/public/system-card/**` needs no line — it is already under
      # `apps/web/**`. Edit BOTH blocks below if you touch this one.
      - "booklet/**"
      # The ATS-anchoring census in
      # `apps/web/tests/unit/ats-anchoring-651.test.mjs` reads FOUR files and
      # three of them are outside `apps/web/**`. Same reason as `booklet/**`
      # above: without these lines, the PR most likely to reintroduce the #651
      # substring bug -- one that edits only a port -- is exactly the PR that
      # would not run the census guarding it.
      #
      # Named file by file rather than as `ml/**` and `backend/**`, because the
      # census cannot discover a port that is not on its own list; matching the
      # trigger to that list keeps the two honest about covering the same
      # things, and keeps a backend-only PR from paying for a `next build`.
      # Add a line here whenever a port is added to that test.
      - "ml/browser/site/app.js"
      - "ml/demo/space/jobtracker/classifier/rules.py"
      - "backend/jobtracker/classifier/rules.py"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
      - "booklet/**"
      # The ATS-anchoring census in
      # `apps/web/tests/unit/ats-anchoring-651.test.mjs` reads FOUR files and
      # three of them are outside `apps/web/**`. Same reason as `booklet/**`
      # above: without these lines, the PR most likely to reintroduce the #651
      # substring bug -- one that edits only a port -- is exactly the PR that
      # would not run the census guarding it.
      #
      # Named file by file rather than as `ml/**` and `backend/**`, because the
      # census cannot discover a port that is not on its own list; matching the
      # trigger to that list keeps the two honest about covering the same
      # things, and keeps a backend-only PR from paying for a `next build`.
      # Add a line here whenever a port is added to that test.
      - "ml/browser/site/app.js"
      - "ml/demo/space/jobtracker/classifier/rules.py"
      - "backend/jobtracker/classifier/rules.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Budgets live on the STEPS, not the job (#702, #712). A job-level
  # `timeout-minutes` ends the job `conclusion: cancelled` — the same
  # conclusion a supersede or a manual cancel produces — so a hang would
  # hide among routine traffic; a step budget fails red. Measured in run
  # 33704966798; the full note is in backend-ci.yml.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    # Placeholder public env vars so `lib/env.ts`'s zod validator succeeds
    # during `next build` / `pnpm typecheck`. These are never used at
    # runtime in CI — they only satisfy the import-time schema check.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BACKEND_API_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        timeout-minutes: 5
        run: pnpm typecheck

      # The `--max-warnings 0` that makes this step able to fail lives on the
      # `lint` script in apps/web/package.json, not here, so a local `pnpm lint`
      # returns the same verdict CI does. It promotes all 25 warn-level rules in
      # next's config, not only the six `jsx-a11y/*` — a hard failure on
      # `react-hooks/exhaustive-deps` or an unused variable is this gate
      # working, not misfiring. Until #176 the step ran bare `eslint`, and since
      # eslint exits 0 on warnings, an `<img>` with no `alt` reported two
      # violations and the job still went green.
      - name: Lint
        timeout-minutes: 5
        run: pnpm lint

      # Node 22+ is required, not incidental: these tests import `.ts` helpers
      # directly and rely on the runtime's built-in type stripping (>= 22.6) and
      # the built-in glob (>= 21). On the Node 20 this job used to pin they
      # failed with ERR_UNKNOWN_FILE_EXTENSION, so the tests existed while no
      # job ran them — a check that could not fail.
      #
      # The suite runs in FOUR ZONES, not one. `local-today.test.mjs` and
      # `dates.test.mjs` assert that day-bucketing follows the READER's calendar
      # day, and `local-today.test.mjs` names UTC as its POSITIVE CONTROL -- the
      # arm that "passed before this fix and must pass after it". GitHub's
      # runners are UTC, so a bare `pnpm test:unit` ran the control and nothing
      # else, for as long as those tests have existed (#835).
      #
      # Measured, on the single most likely regression -- `localTodayISO`
      # "simplified" to the getUTC* getters:
      #
      #     TZ=UTC               3 pass / 0 fail   <- the only arm CI ran
      #     TZ=America/New_York  0 pass / 3 fail
      #     TZ=Asia/Tokyo        0 pass / 3 fail
      #     TZ=Pacific/Auckland  0 pass / 3 fail
      #
      # The zone list is READ BACK by `zone-matrix-runs-in-ci.test.mjs`, which
      # rejects a list that does not span both signs of UTC offset and rejects a
      # zone name `Intl` does not know -- because a MISSPELLED zone does not
      # error, it silently resolves to UTC and becomes a second control.
      #
      # COST, measured on this runner rather than extrapolated from a laptop:
      # 57s for the four zones, against 13-15s for the single-zone step it
      # replaced -- about +42s. The figure that shipped with #835 said ~15s and
      # was wrong: it multiplied a local 3.8s run by four, and a zone here costs
      # ~14s, not 3.8s. Timed from the steps of run 33973900411 against the four
      # runs before it.
      #
      # Every zone runs even after one fails: which zones broke is the finding,
      # since a west-only failure and an all-zones failure are different
      # defects.
      - name: Unit tests (four zones)
        timeout-minutes: 5
        run: |
          set -uo pipefail
          failed=""
          for tz in UTC America/New_York Asia/Tokyo Pacific/Auckland; do
            echo "::group::TZ=$tz"
            if TZ="$tz" pnpm test:unit; then :; else failed="$failed $tz"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::the unit suite failed under:$failed"
            exit 1
          fi

      - name: Build
        timeout-minutes: 5
        run: pnpm build
