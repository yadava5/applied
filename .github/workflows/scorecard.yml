name: OpenSSF Scorecard

# Scorecard grades this repository against 18 supply-chain checks -- pinned
# dependencies, branch protection, code review, SAST, dangerous workflow
# patterns -- and publishes the result at
#   https://scorecard.dev/viewer/?uri=github.com/yadava5/applied
#
# The value is that it is computed by someone else. A number this project
# calculates about itself is a claim; a number the OpenSSF publishes about it is
# evidence, and anyone can re-run it.
#
# The first score will be modest, and that is not the workflow failing. Several
# of the 18 grade repository SETTINGS -- branch protection, signed releases,
# required review -- which no file in this repo can turn on. The score moving up
# over time is the better signal than wherever it starts.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  # Budgets live on the STEPS, not the job (#702, #712). A job-level
  # `timeout-minutes` ends the job `conclusion: cancelled` — the same
  # conclusion a supersede or a manual cancel produces — so a hang would
  # hide among routine traffic; a step budget fails red. Measured in run
  # 33704966798; the full note is in backend-ci.yml.
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # OIDC identity for publish_results
      contents: read
      actions: read            # several checks enumerate workflows and runs

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard reads repository metadata through the API with its own
          # token; keeping the checkout credential out of the workspace is one
          # of the things it grades.
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        timeout-minutes: 10
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        timeout-minutes: 5
        with:
          sarif_file: results.sarif
