name: README facts

# Deliberately NOT a job inside backend-ci.yml. That workflow is path-filtered
# to `backend/**`, so a change that only touches README.md — which is exactly
# how a number goes stale — would never trigger it. This one has no path filter
# at all, because a claim in the README can be invalidated from anywhere in the
# tree: a migration, a spec file, a workflow file, or the prose itself.
on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - integration/web-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Budgets live on the STEPS, not the job (#702, #712). A job-level
  # `timeout-minutes` ends the job `conclusion: cancelled` — the same
  # conclusion a supersede or a manual cancel produces — so a hang would
  # hide among routine traffic; a step budget fails red. Measured in run
  # 33704966798; the full note is in backend-ci.yml.
  check:
    name: README numbers agree with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `pip install`, no venv, no dependencies. The checker is stdlib-only
      # on purpose: it has to stay fast enough that nobody is tempted to make it
      # optional, and a disabled checker is how the drift it guards against
      # started. The recorded figures come from docs/readme-facts.json, which is
      # refreshed by `--record` on a developer machine, never here.
      # WELL-FORMEDNESS FIRST, and repo-wide rather than README-only.
      #
      # A merge left README.md holding the same paragraph three times separated
      # by conflict markers, and `--check` passed on it: the markers DUPLICATE
      # the prose, so every number it looks for is still present and still
      # correct, and the site count went UP — which reads as more coverage
      # rather than as corruption. It was committed and pushed in that state.
      #
      # README-only would not be enough. The same day, `git add -A` staged three
      # conflicted .py files; that surfaced as a SyntaxError only because
      # something happened to import one of them. A file nothing imports would
      # have merged silently. This step costs milliseconds and covers every
      # tracked file, which is the only version of this check worth having.
      #
      # `git grep` exits 1 when it finds NOTHING, so the sense is inverted on
      # purpose: finding a marker is the failure.
      - name: No unresolved conflict markers anywhere in the tree
        run: |
          if git grep -InE '^(<{7}|>{7}|\|{7}|={7})( |$)' -- . ; then
            echo "::error::unresolved git conflict markers are committed above"
            exit 1
          fi
          echo "no conflict markers in any tracked file"

      - name: Check every number the README asserts
        timeout-minutes: 5
        run: python3 scripts/readme_facts.py --check
